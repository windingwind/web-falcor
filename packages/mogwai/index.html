<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mogwai (web-falcor)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font-family: monospace; }
      #canvas { width: 100%; height: 100%; display: block; }
      /* PixelZoom magnifier (hold Z): 200x200 point-filtered window following the cursor. */
      #zoom { position: fixed; width: 200px; height: 200px; pointer-events: none; border: 1px solid #fff; z-index: 20; image-rendering: pixelated; }
      #zoom[hidden] { display: none; }
      #status { position: absolute; top: 8px; left: 8px; white-space: pre; text-shadow: 0 0 4px #000; }
      #controls { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; align-items: center; background: #2a2a2ac0; padding: 6px 8px; border-radius: 4px; }
      #controls button, #controls select, #controls label { font-family: monospace; font-size: 12px; }
      #help { position: absolute; bottom: 8px; left: 8px; font-size: 11px; opacity: 0.55; text-shadow: 0 0 4px #000; }
      #passes { position: absolute; top: 44px; right: 8px; width: 232px; max-height: calc(100% - 56px); overflow-y: auto; background: #2a2a2ad8; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
      #passes details { margin-bottom: 5px; }
      #passes summary { cursor: pointer; color: #8cf; user-select: none; }
      #passes .ui-row { display: flex; align-items: center; gap: 6px; margin: 3px 0 3px 8px; }
      #passes .ui-row span { flex: 1; }
      #passes .ui-row input[type=range] { flex: 1; min-width: 54px; }
      #passes .ui-text { opacity: 0.7; margin: 2px 0 2px 8px; }
      #passes button, #passes select, #passes input { font-family: monospace; font-size: 11px; }
      #passes button { margin: 2px 0 2px 8px; }
      #passes input[type=number] { width: 64px; background: #1e1e1e; color: #ddd; border: 1px solid #444; }
      #passes .ui-vec input[type=number] { width: 46px; }
      #passes details details { margin-left: 8px; }
      #console { position: absolute; bottom: 28px; left: 8px; width: 560px; background: #2a2a2ad8; border-radius: 4px; font-size: 12px; }
      #consoleLog { max-height: 180px; overflow-y: auto; padding: 4px 8px; white-space: pre-wrap; }
      #consoleLog .in { color: #8cf; }
      #consoleLog .err { color: #f88; }
      #consoleInput { width: calc(100% - 16px); margin: 0 8px 6px; background: #1e1e1e; color: #ddd; border: 1px solid #444; font-family: monospace; font-size: 12px; }
      #graphEditor { position: absolute; top: 44px; left: 8px; max-width: calc(100% - 270px); max-height: calc(100% - 90px); overflow: auto; background: #2a2a2ad8; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
      #graphEditor .graph-toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
      #graphEditor .graph-toolbar button, #graphEditor .graph-toolbar select, #graphEditor .graph-toolbar input { font-family: monospace; font-size: 11px; }
      #graphEditor .graph-canvas { display: block; font-family: monospace; font-size: 11px; }
      #graphEditor .graph-node-bg { fill: #1e1e1e; stroke: #8cf; stroke-width: 1; }
      #graphEditor .graph-node-title { fill: #8cf; font-weight: bold; }
      #graphEditor .graph-port { fill: #ddd; cursor: pointer; }
      #graphEditor .graph-port-selected { fill: #ff7f00; }
      #graphEditor .graph-port-label { fill: #ddd; }
      #graphEditor .graph-edge { fill: none; stroke: #ddd; stroke-width: 1.5; cursor: pointer; }
      #graphEditor .graph-edge:hover { stroke: #f88; }
      #graphEditor .graph-node-bg { cursor: move; }
      #graphEditor .graph-node-selected .graph-node-bg { stroke: #fc6; stroke-width: 2; }
      #graphEditor .graph-properties { margin-top: 6px; border-top: 1px solid #444; padding-top: 4px; }
      #graphEditor .graph-properties-title { color: #fc6; font-weight: bold; margin-bottom: 4px; }
      #graphEditor .graph-mark { fill: #555; cursor: pointer; }
      #graphEditor .graph-marked { fill: #fc6; }
      #graphEditor .graph-remove { fill: #f88; cursor: pointer; }
      #profiler { position: absolute; top: 32px; left: 8px; width: 620px; max-height: calc(100% - 80px); overflow-y: auto; background: #2a2a2ad8; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
      #profiler .profiler-options { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 6px; }
      #profiler .profiler-options button, #profiler .profiler-options select { font-family: monospace; font-size: 11px; }
      #profiler table { border-collapse: collapse; width: 100%; }
      #profiler th { text-align: left; font-weight: normal; color: #8cf; padding: 0 8px 5px 0; }
      #profiler td { padding: 1px 8px 1px 0; white-space: nowrap; }
      #profiler td.profiler-bar { width: 50px; }
      #profiler td.profiler-bar div { height: 8px; background: #fff; }
      #profiler .profiler-graph { display: block; margin-top: 6px; }
      #profiler .profiler-tooltip { position: absolute; background: #111; padding: 2px 6px; border-radius: 3px; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1280" height="720"></canvas>
    <canvas id="zoom" hidden></canvas>
    <div id="status">initializing…</div>
    <div id="help">drag: look/orbit · right-drag: roll (6-DOF) · WASD: move · Q/E: down/up · wheel: dolly/zoom · Shift: fast · Ctrl: slow · P: profiler · Z (hold): pixel zoom · Scene panel: controller</div>
    <div id="controls">
      <button id="play">Pause</button>
      <button id="capture">Capture</button>
      <button id="saveConfig" title="Save the graph, scene, camera and clock as a Mogwai script">Save Config</button>
      <button id="record">Record</button>
      <label>graph <input id="graphFile" type="file" accept=".py" /></label>
      <label>output <select id="output"></select></label>
      <button id="consoleToggle">Console</button>
      <button id="graphToggle">Graph</button>
    </div>
    <div id="graphEditor" hidden></div>
    <div id="console" hidden>
      <div id="consoleLog"></div>
      <input id="consoleInput" placeholder="python — m.scene / m.activeGraph / m.settings; Enter to run" />
    </div>
    <div id="passes"></div>
    <div id="profiler" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
