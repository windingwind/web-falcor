<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falcor samples (web-falcor)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font-family: monospace; }
      #canvas { width: 100%; height: 100%; display: block; outline: none; }
      #gui { position: absolute; top: 8px; right: 8px; width: 260px; max-height: calc(100% - 16px); overflow-y: auto; background: #2a2a2ad8; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
      #gui[hidden] { display: none; }
      #gui .ui-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
      #gui .ui-row span { flex: 1; }
      #gui .ui-row input[type=range] { flex: 1; min-width: 54px; }
      #gui .ui-text { opacity: 0.8; margin: 2px 0; }
      #gui summary { cursor: pointer; color: #8cf; user-select: none; }
      #gui button { margin: 2px 4px 2px 0; font-family: monospace; font-size: 11px; }
      #picker { position: absolute; top: 8px; left: 8px; font-size: 12px; background: #2a2a2ad8; padding: 4px 6px; border-radius: 4px; }
      #picker a { color: #8cf; margin-right: 8px; }
      .profiler-window { background: #2a2a2ad8; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
      .profiler-window[hidden] { display: none; }
      .profiler-window .profiler-title { display: flex; justify-content: space-between; color: #8cf; margin-bottom: 4px; }
      .profiler-window .profiler-options { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 6px; }
      .profiler-window button, .profiler-window select { font-family: monospace; font-size: 11px; }
      .profiler-window table { border-collapse: collapse; width: 100%; }
      .profiler-window th { text-align: left; font-weight: normal; color: #8cf; padding: 0 8px 5px 0; }
      .profiler-window td { padding: 1px 8px 1px 0; white-space: nowrap; }
      .profiler-window td.profiler-bar { width: 50px; }
      .profiler-window td.profiler-bar div { height: 8px; background: #fff; }
      .profiler-window .profiler-graph { display: block; margin-top: 6px; }
      .profiler-window .profiler-tooltip { position: absolute; background: #111; padding: 2px 6px; border-radius: 3px; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="picker"></div>
    <div id="gui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
