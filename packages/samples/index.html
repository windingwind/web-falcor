<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falcor samples (web-falcor)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font-family: monospace; }
      #canvas { width: 100%; height: 100%; display: block; outline: none; }
      #gui { position: absolute; top: 8px; right: 8px; width: 260px; max-height: calc(100% - 16px); overflow-y: auto; background: #2a2a2ad8; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
      #gui[hidden] { display: none; }
      #gui .ui-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
      #gui .ui-row span { flex: 1; }
      #gui .ui-row input[type=range] { flex: 1; min-width: 54px; }
      #gui .ui-text { opacity: 0.8; margin: 2px 0; }
      #gui summary { cursor: pointer; color: #8cf; user-select: none; }
      #gui button { margin: 2px 4px 2px 0; font-family: monospace; font-size: 11px; }
      #picker { position: absolute; top: 8px; left: 8px; font-size: 12px; background: #2a2a2ad8; padding: 4px 6px; border-radius: 4px; }
      #picker a { color: #8cf; margin-right: 8px; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="picker"></div>
    <div id="gui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
